services:
  view:
    image: annokk/accounting:latest
    container_name: accounting
    ports:
      - "80:80"
    depends_on:
      - forum-service
  forum-service:
    image: annokk/forum-service:latest
    container_name: forum
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_NAME=telran62
      - MONGO_URI=mongodb://mongo:27017/telran62
    depends_on:
      - mongo
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
        - mongo-data:/data/db
volumes:
  mongo-data:
